name: Mobile Final CRM Polish
on:
  push:
    paths:
      - '.github/workflows/mobile-final-crm-polish.yml'
      - 'mobile-final.css'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='mobile-final-crm-polish-v2'
          if marker in s:
              raise SystemExit(0)
          css=Path('mobile-final.css').read_text(encoding='utf-8')
          s=s.replace('</head>', '<style>\n'+css+'\n</style>\n</head>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Apply final mobile-only CRM responsive polish'
          git push
