name: One-time horizontal staff list

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-horizontal-staff-list.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make admin staff list horizontal
        run: python .github/scripts/make_staff_list_horizontal.py
      - name: Commit horizontal staff list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Make admin staff list horizontal"
            git push origin main
          fi
