name: One-time colorful staff report

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-colorful-staff-report.yml'

permissions:
  contents: write

jobs:
  style-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add subtle colorful staff report boxes
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('index.html'); t=p.read_text(encoding='utf-8'); m='/* Staff report colorful boxes */'; c=base64.b64decode('').decode(); p.write_text(t if m in t else t.replace('\\n</style>',c+'\\n</style>',1),encoding='utf-8')"
      - name: Commit styling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add colorful staff report cards"
            git push origin main
          fi
