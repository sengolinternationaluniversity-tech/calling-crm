name: One-time staff report accordion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-report-accordion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add staff report accordions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* Staff report accordion sections */'
          if marker in text:
              raise SystemExit(0)

          old = '<article class="card">\n    <div class="toolbar"><div><h2>Needs Attention</h2>'
          new = '<article class="card sr-accordion collapsed" id="srAttentionAccordion">\n    <div class="toolbar sr-accordion-toggle" role="button" tabindex="0" aria-expanded="false"><div><h2>Needs Attention</h2>'
          if old not in text:
              raise SystemExit('Needs Attention block not found')
          text = text.replace(old, new, 1)

          old = '<div class="table-wrap"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Reason</th><th>Current Status</th><th>Next Call</th><th>Action</th></tr></thead><tbody id="srAttentionBody">'
          new = '<div class="table-wrap sr-accordion-content"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Reason</th><th>Current Status</th><th>Next Call</th><th>Action</th></tr></thead><tbody id="srAttentionBody">'
          if old not in text:
              raise SystemExit('Needs Attention table not found')
          text = text.replace(old, new, 1)

          old = '<article class="card">\n    <div class="toolbar"><div><h2>Institute-wise Activity</h2>'
          new = '<article class="card sr-accordion collapsed" id="srInstituteAccordion">\n    <div class="toolbar sr-accordion-toggle" role="button" tabindex="0" aria-expanded="false"><div><h2>Institute-wise Activity</h2>'
          if old not in text:
              raise SystemExit('Institute-wise Activity block not found')
          text = text.replace(old, new, 1)

          old = '<div class="table-wrap"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Calls</th><th>Last Call</th><th>Latest Status</th><th>Latest Remarks</th><th>Next Call</th><th>History</th></tr></thead><tbody id="srInstituteBody">'
          new = '<div class="table-wrap sr-accordion-content"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Calls</th><th>Last Call</th><th>Latest Status</th><th>Latest Remarks</th><th>Next Call</th><th>History</th></tr></thead><tbody id="srInstituteBody">'
          if old not in text:
              raise SystemExit('Institute-wise Activity table not found')
          text = text.replace(old, new, 1)

          css = r'''

/* Staff report accordion sections */
#staffReportDashboard .sr-accordion{padding:0;overflow:hidden;border-color:#d5ad94}
#staffReportDashboard .sr-accordion-toggle{
  margin:0;
  padding:11px 14px;
  min-height:54px;
  background:linear-gradient(90deg,#a74416 0%,#853817 55%,#4a2b19 100%);
  color:#fff;
  cursor:pointer;
  user-select:none;
  border-radius:11px;
  gap:10px;
}
#staffReportDashboard .sr-accordion-toggle h2,
#staffReportDashboard .sr-accordion-toggle b{color:#fff}
#staffReportDashboard .sr-accordion-toggle .subnote{color:#f6ddd0!important}
#staffReportDashboard .sr-accordion-toggle:after{
  content:"⌄";
  margin-left:4px;
  font-size:22px;
  line-height:1;
  color:#fff;
  transition:transform .18s ease;
}
#staffReportDashboard .sr-accordion.collapsed .sr-accordion-toggle:after{transform:rotate(-90deg)}
#staffReportDashboard .sr-accordion-content{margin:0 12px 12px}
#staffReportDashboard .sr-accordion.collapsed .sr-accordion-content{display:none}
#staffReportDashboard .sr-accordion:not(.collapsed) .sr-accordion-toggle{border-radius:11px 11px 7px 7px}
'''
          text = text.replace('\n</style>', css + '\n</style>', 1)

          js = r'''

function setupStaffReportAccordions(){
 document.querySelectorAll('#staffReportDashboard .sr-accordion').forEach(section=>{
  const toggle=section.querySelector('.sr-accordion-toggle');
  if(!toggle||toggle.dataset.bound==='1')return;
  toggle.dataset.bound='1';
  const switchState=()=>{
   const collapsed=section.classList.toggle('collapsed');
   toggle.setAttribute('aria-expanded',String(!collapsed));
  };
  toggle.addEventListener('click',switchState);
  toggle.addEventListener('keydown',e=>{
   if(e.key==='Enter'||e.key===' '){e.preventDefault();switchState()}
  });
 });
}
setupStaffReportAccordions();
'''
          text = text.replace('\n</script></body></html>', js + '\n</script></body></html>', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit accordion change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Make staff report sections collapsible"
            git push origin main
          fi
