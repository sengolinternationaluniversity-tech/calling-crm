name: One-time staff report accordion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-report-accordion.yml'

permissions:
  contents: write

jobs:
  patch-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch staff report accordions
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='/* Staff report accordion sections */'
          if marker not in text:
              text=text.replace('<article class="card">\n    <div class="toolbar"><div><h2>Needs Attention</h2>','<article class="card sr-accordion collapsed" id="srAttentionAccordion">\n    <div class="toolbar sr-accordion-toggle" role="button" tabindex="0" aria-expanded="false"><div><h2>Needs Attention</h2>',1)
              text=text.replace('<div class="table-wrap"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Reason</th><th>Current Status</th><th>Next Call</th><th>Action</th></tr></thead><tbody id="srAttentionBody">','<div class="table-wrap sr-accordion-content"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Reason</th><th>Current Status</th><th>Next Call</th><th>Action</th></tr></thead><tbody id="srAttentionBody">',1)
              text=text.replace('<article class="card">\n    <div class="toolbar"><div><h2>Institute-wise Activity</h2>','<article class="card sr-accordion collapsed" id="srInstituteAccordion">\n    <div class="toolbar sr-accordion-toggle" role="button" tabindex="0" aria-expanded="false"><div><h2>Institute-wise Activity</h2>',1)
              text=text.replace('<div class="table-wrap"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Calls</th><th>Last Call</th><th>Latest Status</th><th>Latest Remarks</th><th>Next Call</th><th>History</th></tr></thead><tbody id="srInstituteBody">','<div class="table-wrap sr-accordion-content"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Calls</th><th>Last Call</th><th>Latest Status</th><th>Latest Remarks</th><th>Next Call</th><th>History</th></tr></thead><tbody id="srInstituteBody">',1)
              css='''\n\n/* Staff report accordion sections */\n#staffReportDashboard .sr-accordion{padding:0;overflow:hidden;border-color:#d5ad94}\n#staffReportDashboard .sr-accordion-toggle{margin:0;padding:11px 14px;min-height:54px;background:linear-gradient(90deg,#a74416 0%,#853817 55%,#4a2b19 100%);color:#fff;cursor:pointer;user-select:none;border-radius:11px;gap:10px}\n#staffReportDashboard .sr-accordion-toggle h2,#staffReportDashboard .sr-accordion-toggle b{color:#fff}\n#staffReportDashboard .sr-accordion-toggle .subnote{color:#f6ddd0!important}\n#staffReportDashboard .sr-accordion-toggle:after{content:"⌄";margin-left:4px;font-size:22px;line-height:1;color:#fff;transition:transform .18s ease}\n#staffReportDashboard .sr-accordion.collapsed .sr-accordion-toggle:after{transform:rotate(-90deg)}\n#staffReportDashboard .sr-accordion-content{margin:0 12px 12px}\n#staffReportDashboard .sr-accordion.collapsed .sr-accordion-content{display:none}\n#staffReportDashboard .sr-accordion:not(.collapsed) .sr-accordion-toggle{border-radius:11px 11px 7px 7px}\n'''
              text=text.replace('\n</style>',css+'\n</style>',1)
              js='''\n\nfunction setupStaffReportAccordions(){\n document.querySelectorAll('#staffReportDashboard .sr-accordion').forEach(section=>{\n  const toggle=section.querySelector('.sr-accordion-toggle');\n  if(!toggle||toggle.dataset.bound==='1')return;\n  toggle.dataset.bound='1';\n  const switchState=()=>{const collapsed=section.classList.toggle('collapsed');toggle.setAttribute('aria-expanded',String(!collapsed));};\n  toggle.addEventListener('click',switchState);\n  toggle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();switchState()}});\n });\n}\nsetupStaffReportAccordions();\n'''
              text=text.replace('\n</script></body></html>',js+'\n</script></body></html>',1)
              p.write_text(text,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Make staff report sections collapsible"
            git push origin main
          fi
