name: Force Follow-up Error Background
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/force-followup-error-bg.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="nextInput?.classList.remove('field-invalid');if(follow&&!rawNext){nextInput?.classList.add('field-invalid');toast('Next Follow-up Date fill karein');nextInput?.focus();return}const nextCallAt=rawNext?followUpDateIso(rawNext):null;if(rawNext&&!nextCallAt){nextInput?.classList.add('field-invalid');toast('Next Follow-up Date DD/MM/YYYY format mein fill karein');nextInput?.focus();return}"
          new="nextInput?.classList.remove('field-invalid');nextInput?.style.removeProperty('background');nextInput?.style.removeProperty('background-color');if(follow&&!rawNext){nextInput?.classList.add('field-invalid');nextInput?.style.setProperty('background-color','#fff1f2','important');toast('Next Follow-up Date fill karein');nextInput?.focus();return}const nextCallAt=rawNext?followUpDateIso(rawNext):null;if(rawNext&&!nextCallAt){nextInput?.classList.add('field-invalid');nextInput?.style.setProperty('background-color','#fff1f2','important');toast('Next Follow-up Date DD/MM/YYYY format mein fill karein');nextInput?.focus();return}"
          if old not in s:
              raise SystemExit('Expected validation block not found')
          s=s.replace(old,new,1)
          old2="$('#callLogForm').elements.next_call_at.addEventListener('input',e=>e.target.classList.remove('field-invalid'));"
          new2="$('#callLogForm').elements.next_call_at.addEventListener('input',e=>{e.target.classList.remove('field-invalid');e.target.style.removeProperty('background');e.target.style.removeProperty('background-color')});"
          if old2 not in s:
              raise SystemExit('Expected input listener not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Force light red background for invalid follow-up date'
          git push
