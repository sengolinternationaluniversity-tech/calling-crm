name: One-time compact staff university tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-compact-staff-university-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact staff university tabs
        run: python3 .github/scripts/compact_staff_university_tabs.py
      - name: Commit staff university tab height
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match staff university tabs to calling tab height"
          git push
