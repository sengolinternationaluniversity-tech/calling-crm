name: One-time Staff Report Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Upgrade staff report without changing admin report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''

          /* Staff performance report dashboard */
          .staff-report-only{display:none}
          body.staff-role #staffReportDashboard{display:block}
          body.staff-role #reportsPage>.report-stats,
          body.staff-role #reportsPage>.report-grid,
          body.staff-role #reportsPage>.report-history{display:none!important}
          body.staff-role #reportsPage>.heading{margin-bottom:8px}
          body.staff-role #reportsPage>.heading h1{font-size:24px}
          body.staff-role #reportsPage>.heading p{font-size:12px}
          body.staff-role #reportsPage>.report-filters{margin-top:0;padding:10px 12px;gap:8px}
          body.staff-role #reportsPage>.report-filters .field{font-size:11px;gap:3px}
          body.staff-role #reportsPage>.report-filters input{height:34px;padding:5px 9px}
          body.staff-role #reportsPage>.report-filters .btn{height:34px;padding:5px 12px}
          .staff-report-quick{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 2px}
          .staff-report-quick .btn{padding:7px 12px}
          .staff-report-quick .btn.active{background:#155a42;color:#fff;border-color:#155a42}
          .staff-report-range-label{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}
          .staff-report-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 1px 7px;font-size:13px;font-weight:800;color:#29473a}
          .staff-report-section-title small{font-weight:600;color:var(--muted)}
          .staff-report-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
          .sr-card{background:#fff;border:1px solid #c9d4cc;border-radius:11px;padding:11px 13px;min-height:83px;display:flex;flex-direction:column;justify-content:center}
          .sr-card span{font-size:11px;color:#60736a;font-weight:700}
          .sr-card b{font-size:25px;line-height:1.15;color:#123f31;margin-top:3px}
          .sr-card small{font-size:10px;color:#87938d;margin-top:2px}
          .sr-card.alert b{color:#b4232c}.sr-card.good b{color:#087f5b}
          .staff-report-grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(360px,1.2fr);gap:12px}
          #staffReportDashboard .card{margin-top:10px;padding:13px}
          #staffReportDashboard .card h2{font-size:16px;margin:0}
          #staffReportDashboard .card .subnote{font-size:11px;color:var(--muted);margin:3px 0 0}
          .sr-stage-list{display:grid;gap:8px;margin-top:12px}
          .sr-stage-row{display:grid;grid-template-columns:135px 1fr 45px;gap:8px;align-items:center;font-size:12px}
          .sr-stage-track{height:9px;background:#edf1ee;border-radius:20px;overflow:hidden}
          .sr-stage-fill{height:100%;background:#166044;border-radius:20px;min-width:2px}
          .sr-stage-row b{text-align:right}
          .sr-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
          .sr-table th,.sr-table td{padding:8px 9px;border-right:1px solid #d7dfd9;border-bottom:1px solid #d3dcd5;vertical-align:top}
          .sr-table th:last-child,.sr-table td:last-child{border-right:0}
          .sr-table th{background:#f6f0ec;color:#9b482e}
          .sr-table td.wrap{white-space:normal;min-width:220px;line-height:1.3}
          .sr-reason{display:inline-block;padding:4px 7px;border-radius:7px;font-weight:700;font-size:11px;background:#eef3ef;color:#29473a}
          .sr-reason.overdue{background:#fae6e4;color:#a52f2a}.sr-reason.today{background:#fff0c7;color:#8a5a00}.sr-reason.interested{background:#dcfce7;color:#087f5b}
          .sr-view-btn{padding:5px 8px!important;font-size:11px!important;white-space:nowrap}
          @media(max-width:1050px){.staff-report-cards{grid-template-columns:repeat(2,1fr)}.staff-report-grid{grid-template-columns:1fr}}
          @media(max-width:680px){.staff-report-cards{grid-template-columns:1fr 1fr}.staff-report-range-label{width:100%;margin-left:0}.sr-table{min-width:850px}}
          '''
          if '/* Staff performance report dashboard */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          dashboard = r'''
          <section id="staffReportDashboard" class="staff-report-only">
            <div class="staff-report-quick">
              <button class="btn secondary" type="button" data-report-quick="today">Today</button>
              <button class="btn secondary" type="button" data-report-quick="week">This Week</button>
              <button class="btn secondary active" type="button" data-report-quick="month">This Month</button>
              <span id="staffReportRangeLabel" class="staff-report-range-label"></span>
            </div>

            <div class="staff-report-section-title"><span>Period Performance</span><small>Selected date range ke calls</small></div>
            <div class="staff-report-cards">
              <article class="sr-card"><span>Total Calls</span><b id="srTotalCalls">0</b><small>All call attempts</small></article>
              <article class="sr-card"><span>Unique Institutes Called</span><b id="srUniqueCalled">0</b><small>Repeat calls excluded</small></article>
              <article class="sr-card good"><span>Interested Calls</span><b id="srInterested">0</b><small>Interested status attempts</small></article>
              <article class="sr-card good"><span>Done Calls</span><b id="srDone">0</b><small>Completed status attempts</small></article>
            </div>

            <div class="staff-report-section-title"><span>Current Workload</span><small>Abhi kya pending hai</small></div>
            <div class="staff-report-cards">
              <article class="sr-card"><span>Assigned Institutes</span><b id="srAssigned">0</b><small>Currently assigned to you</small></article>
              <article class="sr-card"><span>Not Called</span><b id="srNotCalled">0</b><small>No status yet</small></article>
              <article class="sr-card"><span>Today's Follow-ups</span><b id="srTodayFollowups">0</b><small>Call due today</small></article>
              <article class="sr-card alert"><span>Overdue Follow-ups</span><b id="srOverdue">0</b><small>Follow-up date passed</small></article>
            </div>

            <div class="staff-report-grid">
              <article class="card">
                <div class="toolbar"><div><h2>Call Result Summary</h2><p class="subnote">Har status par kitne call attempts hue.</p></div></div>
                <div class="table-wrap"><table class="sr-table"><thead><tr><th>Status</th><th>Calls</th><th>%</th></tr></thead><tbody id="srStatusBody"><tr><td colspan="3" class="empty">No activity</td></tr></tbody></table></div>
              </article>
              <article class="card">
                <div class="toolbar"><div><h2>Stage Activity</h2><p class="subnote">Selected period mein unique institutes jo stage tak पहुंचे.</p></div></div>
                <div id="srStageList" class="sr-stage-list"></div>
              </article>
            </div>

            <article class="card">
              <div class="toolbar"><div><h2>Needs Attention</h2><p class="subnote">Overdue, today follow-up, interested without next date aur not-called records.</p></div><b id="srAttentionCount">0 records</b></div>
              <div class="table-wrap"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Reason</th><th>Current Status</th><th>Next Call</th><th>Action</th></tr></thead><tbody id="srAttentionBody"><tr><td colspan="6" class="empty">No pending action</td></tr></tbody></table></div>
            </article>

            <article class="card">
              <div class="toolbar"><div><h2>Institute-wise Activity</h2><p class="subnote">Selected period mein institute-wise calls, latest status aur remarks.</p></div><b id="srInstituteCount">0 institutes</b></div>
              <div class="table-wrap"><table class="sr-table"><thead><tr><th>Institute</th><th>Mobile</th><th>Calls</th><th>Last Call</th><th>Latest Status</th><th>Latest Remarks</th><th>Next Call</th><th>History</th></tr></thead><tbody id="srInstituteBody"><tr><td colspan="8" class="empty">No activity in this range</td></tr></tbody></table></div>
            </article>
          </section>
          '''
          anchor = '<button id="exportReport" class="btn green" type="button">Download Excel</button></div><div class="stats report-stats">'
          if 'id="staffReportDashboard"' not in s:
              if anchor not in s:
                  raise SystemExit('report HTML anchor not found')
              s = s.replace(anchor, '<button id="exportReport" class="btn green" type="button">Download Excel</button></div>' + dashboard + '<div class="stats report-stats">', 1)

          old_select = "select('id,status,remarks,next_call_at,created_at,staff_id,staff_name,crm_profiles(full_name,username),crm_institutes(institute_name,location,state,mobile_no,whatsapp_no)')"
          new_select = "select('id,institute_id,status,remarks,next_call_at,created_at,staff_id,staff_name,crm_profiles(full_name,username),crm_institutes(institute_name,owner_name,location,state,mobile_no,whatsapp_no)')"
          if old_select in s:
              s = s.replace(old_select, new_select, 1)

          old_filter = "if(isAdmin()&&staff)q=q.eq('staff_id',staff);const {data,error}=await q.range(from,from+999);"
          new_filter = "if(isAdmin()&&staff)q=q.eq('staff_id',staff);if(!isAdmin())q=q.eq('staff_id',S.user.id);const {data,error}=await q.range(from,from+999);"
          if old_filter in s:
              s = s.replace(old_filter, new_filter, 1)

          old_load = "async function loadReports(){try{const rows=await fetchReportLogs();"
          new_load = "async function loadReports(){try{if(!isAdmin()){await loadStaffReport();return}const rows=await fetchReportLogs();"
          if old_load in s:
              s = s.replace(old_load, new_load, 1)
          elif 'await loadStaffReport();return' not in s:
              raise SystemExit('loadReports anchor not found')

          js = r'''
          async function fetchStaffReportState(){
            let out=[];
            for(let from=0;;from+=1000){
              let q=db.from('crm_institute_call_state').select('id,institute_name,owner_name,location,state,mobile_no,whatsapp_no,last_status,last_remarks,next_call_at,assigned_to').order('serial_no',{ascending:true});
              if(!isAdmin())q=q.eq('assigned_to',S.user.id);
              const {data,error}=await q.range(from,from+999);
              if(error)throw error;
              out.push(...(data||[]));
              if(!data||data.length<1000)break
            }
            return out
          }
          function staffReportSet(id,value){const el=$(id);if(el)el.textContent=Number(value||0).toLocaleString()}
          function staffReportQuickRange(mode){
            const now=new Date(),from=$('#reportFrom'),to=$('#reportTo');
            if(!from||!to)return;
            let start=new Date(now.getFullYear(),now.getMonth(),now.getDate());
            if(mode==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day)}
            if(mode==='month')start=new Date(now.getFullYear(),now.getMonth(),1);
            from.value=dateInputValue(start);to.value=dateInputValue(now);
            document.querySelectorAll('[data-report-quick]').forEach(b=>b.classList.toggle('active',b.dataset.reportQuick===mode));
            loadReports()
          }
          async function loadStaffReport(){
            const from=$('#reportFrom'),to=$('#reportTo');
            if(from?.value&&to?.value&&from.value>to.value){toast('From Date, To Date se badi nahi ho sakti');return}
            const [rows,stateRows]=await Promise.all([fetchReportLogs(),fetchStaffReportState()]);
            S.reportRows=rows;S.staffReportStateRows=stateRows;
            const title=$('#reportsPage>.heading h1'),sub=$('#reportsPage>.heading p');if(title)title.textContent='My Performance Report';if(sub)sub.textContent='Aapki calling activity, results, workload aur pending follow-ups.';
            const counts=statusCounts(rows),total=rows.length,groups=new Map();
            rows.forEach(x=>{const key=x.institute_id||x.crm_institutes?.institute_name||x.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)});
            const unique=groups.size;
            staffReportSet('#srTotalCalls',total);staffReportSet('#srUniqueCalled',unique);staffReportSet('#srInterested',counts['Interested']||0);staffReportSet('#srDone',counts['Done']||0);
            const {start:todayStart,end:todayEnd}=callDayBounds(),today0=new Date(todayStart),today1=new Date(todayEnd);
            const notCalled=stateRows.filter(x=>!x.last_status),todayFollow=stateRows.filter(x=>x.next_call_at&&new Date(x.next_call_at)>=today0&&new Date(x.next_call_at)<today1),overdue=stateRows.filter(x=>x.next_call_at&&new Date(x.next_call_at)<today0);
            staffReportSet('#srAssigned',stateRows.length);staffReportSet('#srNotCalled',notCalled.length);staffReportSet('#srTodayFollowups',todayFollow.length);staffReportSet('#srOverdue',overdue.length);
            const rangeLabel=$('#staffReportRangeLabel');if(rangeLabel)rangeLabel.textContent=`${formatDate($('#reportFrom').value)} – ${formatDate($('#reportTo').value)}`;
            const statusBody=$('#srStatusBody');if(statusBody)statusBody.innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([st,n])=>`<tr><td><b>${esc(st||'—')}</b></td><td>${n.toLocaleString()}</td><td>${total?Math.round(n*100/total):0}%</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No calls in this date range</td></tr>';
            const stages=[['Called Institutes',new Set(rows.map(x=>x.institute_id).filter(Boolean)).size],['Interested',new Set(rows.filter(x=>x.status==='Interested').map(x=>x.institute_id).filter(Boolean)).size],['MOU Sent',new Set(rows.filter(x=>x.status==='MOU Sent').map(x=>x.institute_id).filter(Boolean)).size],['Done',new Set(rows.filter(x=>x.status==='Done').map(x=>x.institute_id).filter(Boolean)).size]],stageMax=Math.max(1,...stages.map(x=>x[1]));
            const stageBox=$('#srStageList');if(stageBox)stageBox.innerHTML=stages.map(([name,n])=>`<div class="sr-stage-row"><span>${esc(name)}</span><div class="sr-stage-track"><div class="sr-stage-fill" style="width:${Math.max(2,Math.round(n*100/stageMax))}%"></div></div><b>${n}</b></div>`).join('');
            const attention=stateRows.map(x=>{const next=x.next_call_at?new Date(x.next_call_at):null;if(next&&next<today0)return{x,rank:1,reason:'Overdue',cls:'overdue'};if(next&&next>=today0&&next<today1)return{x,rank:2,reason:'Today Follow-up',cls:'today'};if(String(x.last_status||'').toLowerCase()==='interested'&&!next)return{x,rank:3,reason:'Interested · No Next Date',cls:'interested'};if(!x.last_status)return{x,rank:4,reason:'Not Called',cls:''};return null}).filter(Boolean).sort((a,b)=>a.rank-b.rank||String(a.x.institute_name||'').localeCompare(String(b.x.institute_name||'')));
            const attBody=$('#srAttentionBody'),attCount=$('#srAttentionCount');if(attCount)attCount.textContent=`${attention.length.toLocaleString()} records`;if(attBody)attBody.innerHTML=attention.slice(0,100).map(({x,reason,cls})=>`<tr><td class="wrap"><b>${esc(x.institute_name||'—')}</b><br><small>${esc([x.location,x.state].filter(Boolean).join(', '))}</small></td><td>${mobileBoxes(x.mobile_no)}</td><td><span class="sr-reason ${cls}">${esc(reason)}</span></td><td>${esc(x.last_status||'Not Called')}</td><td>${x.next_call_at?formatDate(x.next_call_at):'—'}</td><td><button class="btn green sr-view-btn" type="button" onclick="openStaffReportCall('${attr(x.id)}')">☎ Call</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No pending action</td></tr>';
            const summary=[...groups.entries()].map(([key,list])=>{const latest=list[0],ins=latest.crm_institutes||{};return{id:latest.institute_id||key,institute_name:ins.institute_name||'—',location:ins.location||'',state:ins.state||'',mobile_no:ins.mobile_no||'',whatsapp_no:ins.whatsapp_no||'',calls:list.length,last_call:latest.created_at,status:latest.status||'—',remarks:latest.remarks||'No remarks',next_call_at:latest.next_call_at||null}}).sort((a,b)=>new Date(b.last_call)-new Date(a.last_call));
            S.staffReportInstituteRows=summary;
            const instCount=$('#srInstituteCount'),instBody=$('#srInstituteBody');if(instCount)instCount.textContent=`${summary.length.toLocaleString()} institutes`;if(instBody)instBody.innerHTML=summary.map(x=>`<tr><td class="wrap"><b>${esc(x.institute_name)}</b><br><small>${esc([x.location,x.state].filter(Boolean).join(', '))}</small></td><td>${mobileBoxes(x.mobile_no)}</td><td><b>${x.calls}</b></td><td>${formatCallDateTime(x.last_call)}</td><td>${esc(x.status)}</td><td class="wrap" title="${attr(x.remarks)}">${esc(x.remarks)}</td><td>${x.next_call_at?formatDate(x.next_call_at):'—'}</td><td><button class="btn secondary sr-view-btn" type="button" onclick="openCallConversation('${attr(x.id)}','${attr(x.institute_name)}')">View Calls</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No activity in this range</td></tr>'
          }
          window.openStaffReportCall=async id=>{
            const {data,error}=await db.from('crm_institute_call_state').select('*').eq('id',id).single();if(error||!data){toast(error?.message||'Record load nahi hua');return}
            $$('.page').forEach(x=>x.classList.remove('active'));$('#callingPage').classList.add('active');$$('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page==='calling'));const context=$('#topContextTitle'),topTabs=$('#topInstituteTabs');if(context)context.classList.add('hidden');if(topTabs)topTabs.classList.add('hidden');
            const callingTab=document.querySelector('[data-call-page-tab="calling"]');if(callingTab)callingTab.click();S.callRows=[data];S.callIndex=0;$('#callQueueInfo').textContent='Report follow-up';renderCallRecord();setTimeout(()=>$('#callRecord')?.scrollIntoView({behavior:'smooth',block:'start'}),50)
          }
          '''
          marker = 'async function loadDashboardAnalytics(){'
          if 'async function loadStaffReport(){' not in s:
              if marker not in s:
                  raise SystemExit('dashboard analytics marker not found')
              s = s.replace(marker, js + '\n' + marker, 1)

          hooks = r'''
          document.querySelectorAll('[data-report-quick]').forEach(b=>b.onclick=()=>staffReportQuickRange(b.dataset.reportQuick));
          const originalReportExport=$('#exportReport')?.onclick;
          if($('#exportReport'))$('#exportReport').onclick=()=>{
            if(isAdmin()){if(originalReportExport)return originalReportExport()}
            const data=S.staffReportInstituteRows||[];if(!data.length){toast('Report mein data nahi hai');return}
            makeSheet(data.map((x,i)=>({'S.No.':i+1,'Institute':x.institute_name,'Location':x.location,'State':x.state,'Mobile':x.mobile_no,'WhatsApp':x.whatsapp_no,'Calls':x.calls,'Last Call':formatCallDateTime(x.last_call).replace(/<[^>]+>/g,' '),'Latest Status':x.status,'Latest Remarks':x.remarks,'Next Call':x.next_call_at?formatDate(x.next_call_at):''})),'calling-crm-my-performance-report.xlsx')
          };
          '''
          hook_marker = 'function callDayBounds(){'
          if 'originalReportExport' not in s:
              if hook_marker not in s:
                  raise SystemExit('callDayBounds marker not found')
              s = s.replace(hook_marker, hooks + '\n' + hook_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit upgraded report
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No report changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build staff performance report dashboard"
          git push origin HEAD:main
