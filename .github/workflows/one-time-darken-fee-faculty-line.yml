name: One-time darken fee faculty line

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-darken-fee-faculty-line.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Darken faculty separator
        run: python3 .github/scripts/darken_fee_faculty_line.py
      - name: Commit faculty separator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Darken fee faculty separator line"
          git push
