name: One-time staff university new tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-university-new-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staff university detail new-tab behavior
        run: python3 .github/scripts/open_university_detail_new_tab_staff.py
      - name: Commit staff university detail new-tab behavior
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open staff University Detail in a new tab"
          git push
