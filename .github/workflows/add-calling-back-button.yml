name: Add Calling Back Button
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/add-calling-back-button.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="call-log-actions"><button id="callSaveNextBtn" class="btn primary" type="submit">Save Status & Next</button><button id="callNextBtn" class="btn secondary" type="button"${S.callIndex>=S.callRows.length-1?\' disabled\':\'\'}>Next →</button></div>'
          new='<div class="call-log-actions"><button id="callBackBtn" class="btn secondary" type="button"${S.callIndex<=0?\' disabled\':\'\'}>← Back</button><button id="callSaveNextBtn" class="btn primary" type="submit">Save Status & Next</button><button id="callNextBtn" class="btn secondary" type="button"${S.callIndex>=S.callRows.length-1?\' disabled\':\'\'}>Next →</button></div>'
          if old not in s:
              raise SystemExit('Call action buttons block not found')
          s=s.replace(old,new,1)
          old2="const callNextBtn=$('#callNextBtn');if(callNextBtn)callNextBtn.onclick=()=>{if(S.callIndex>=S.callRows.length-1){toast('Last record hai');return}S.callIndex++;renderCallRecord();$('#callRecord')?.scrollIntoView({behavior:'smooth',block:'start'})};"
          new2="const callBackBtn=$('#callBackBtn');if(callBackBtn)callBackBtn.onclick=()=>{if(S.callIndex<=0){toast('First record hai');return}S.callIndex--;renderCallRecord();$('#callRecord')?.scrollIntoView({behavior:'smooth',block:'start'})};const callNextBtn=$('#callNextBtn');if(callNextBtn)callNextBtn.onclick=()=>{if(S.callIndex>=S.callRows.length-1){toast('Last record hai');return}S.callIndex++;renderCallRecord();$('#callRecord')?.scrollIntoView({behavior:'smooth',block:'start'})};"
          if old2 not in s:
              raise SystemExit('Next button handler block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Add Back button to calling screen'
          git push
