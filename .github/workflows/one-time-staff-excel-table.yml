name: One-time staff Excel table

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-excel-table.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make staff list Excel style
        run: python .github/scripts/make_staff_excel_table.py
      - name: Commit staff table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Show admin staff list as Excel style table"
            git push origin main
          fi
