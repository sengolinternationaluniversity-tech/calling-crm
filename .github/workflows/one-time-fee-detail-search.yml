name: One-time fee detail search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fee-detail-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fee detail search
        run: python3 .github/scripts/add_fee_detail_search.py
      - name: Commit fee detail search
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add live search to fee detail"
          git push
