name: One-time Remove Send to Center

on:
  push:
    paths:
      - '.github/workflows/one-time-remove-send-center.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove Send to Center flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_button = '<button class="btn secondary" type="button" onclick="openSendToCenter()">📄 Send to Center</button>'
          if old_button not in s:
              raise SystemExit('Send to Center button not found')
          s = s.replace(old_button, '', 1)

          start = '\n\n/* Calling: send saved template + selected fee structure */'
          end = "\n$('#recordForm').onsubmit="
          if start not in s or end not in s:
              raise SystemExit('Send to Center JS markers not found')
          before, rest = s.split(start, 1)
          _, after = rest.split(end, 1)
          s = before + end + after

          p.write_text(s, encoding='utf-8')
      - name: Verify removal
        run: |
          ! grep -q 'openSendToCenter' index.html
          ! grep -q 'Send to Center</button>' index.html
          grep -q 'data-university-tab="messages"' index.html
          grep -q 'WhatsApp Template' index.html
          git diff --check
      - name: Commit change
        run: |
          git config user.name 'SENGOL INTERNATIONAL UNIVERSITY'
          git config user.email 'sengolinternationaluniversity@gmail.com'
          git add index.html
          git commit -m 'Remove fee PDF Send to Center flow'
          git push origin main
