name: One-time fee faculty 3-column

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fee-faculty-3col.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange faculty boxes 3 per row
        run: python3 .github/scripts/fee_faculty_3col.py
      - name: Commit faculty layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Arrange fee faculties in 3-column selector"
          git push
