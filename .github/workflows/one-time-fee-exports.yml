name: One-time fee exports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fee-exports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fee export buttons
        run: python3 .github/scripts/add_fee_exports.py
      - name: Commit fee exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add PDF and Excel export to fee detail"
          git push
