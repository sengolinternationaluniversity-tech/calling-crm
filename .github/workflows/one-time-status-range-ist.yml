name: One-time status range IST fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-status-range-ist.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix calling status range
        run: python .github/scripts/fix_status_range_ist.py
      - name: Commit status range fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix calling status range across devices"
            git push origin main
          fi
