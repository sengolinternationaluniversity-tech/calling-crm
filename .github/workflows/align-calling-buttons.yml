name: Align Calling Buttons
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/align-calling-buttons.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css="""
.call-log-actions{grid-column:1/-1!important;display:grid!important;grid-template-columns:140px minmax(0,1fr) 140px!important;gap:8px!important;align-items:stretch!important}
.call-log-actions #callBackBtn,.call-log-actions #callSaveNextBtn,.call-log-actions #callNextBtn{grid-column:auto!important;width:100%!important;margin:0!important;min-width:0!important}
@media(max-width:680px){.call-log-actions{grid-template-columns:92px minmax(0,1fr) 92px!important;gap:6px!important}.call-log-actions .btn{padding-left:8px!important;padding-right:8px!important}}
"""
          if css.strip() in s:
              raise SystemExit('CSS already present')
          marker='</style>'
          if marker not in s:
              raise SystemExit('style closing tag not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Keep Back Save Next and Next on one row'
          git push
