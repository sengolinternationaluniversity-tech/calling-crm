name: One-time approval table editor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-approval-table-editor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add approval table editor
        run: python3 .github/scripts/add_approval_table_editor.py
      - name: Commit approval editor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add customizable approval rows and columns"
          git push
