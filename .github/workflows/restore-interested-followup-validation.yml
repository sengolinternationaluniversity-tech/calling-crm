name: Restore Interested Follow-up Validation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/restore-interested-followup-validation.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const statusMeta=S.callStatuses.find(x=>x.name===status),statusKey=String(status||'').trim().toLowerCase(),follow=statusKey==='interested'?false:(statusMeta?statusMeta.requires_follow_up:['follow up','call back later'].includes(statusKey));if(follow&&!rawNext){toast('Follow-up date choose karein');form.elements.next_call_at?.focus();return}const nextCallAt=rawNext?followUpDateIso(rawNext):null;if(rawNext&&!nextCallAt){toast('Date DD/MM/YYYY format mein likhein');form.elements.next_call_at?.focus();return}"
          new="const statusMeta=S.callStatuses.find(x=>x.name===status),statusKey=String(status||'').trim().toLowerCase(),follow=statusMeta?statusMeta.requires_follow_up:['follow up','call back later','interested'].includes(statusKey);const nextInput=form.elements.next_call_at;nextInput?.classList.remove('field-invalid');if(follow&&!rawNext){nextInput?.classList.add('field-invalid');toast('Next Follow-up Date fill karein');nextInput?.focus();return}const nextCallAt=rawNext?followUpDateIso(rawNext):null;if(rawNext&&!nextCallAt){nextInput?.classList.add('field-invalid');toast('Next Follow-up Date DD/MM/YYYY format mein fill karein');nextInput?.focus();return}"
          if old not in s:
              raise SystemExit('Expected follow-up validation code not found')
          s=s.replace(old,new,1)
          bind="$('#callLogForm').elements.status.addEventListener('change',syncCallButtons);syncCallButtons();"
          repl="$('#callLogForm').elements.status.addEventListener('change',syncCallButtons);$('#callLogForm').elements.next_call_at.addEventListener('input',e=>e.target.classList.remove('field-invalid'));syncCallButtons();"
          if bind not in s:
              raise SystemExit('Expected call form binding not found')
          s=s.replace(bind,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Require follow-up date for Interested with field warning'
          git push
