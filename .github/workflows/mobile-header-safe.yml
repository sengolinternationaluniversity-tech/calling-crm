name: Mobile Header Safe

on:
  push:
    paths:
      - '.github/workflows/mobile-header-safe.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile header
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'mobile-header-safe-v3' not in s:
              css = '''<style id="mobile-header-safe-v3">
          @media(max-width:760px){
            body{padding-bottom:0!important}
            .main{margin-left:0!important;width:100%!important;min-width:0!important}
            .side{position:relative!important;inset:auto!important;width:100%!important;height:auto!important;min-height:0!important;padding:10px 12px!important;background:#fff!important;color:#10243c!important;border:0!important;border-bottom:1px solid #dbe4ef!important;box-shadow:0 2px 10px #10243c12!important;z-index:500!important;display:grid!important;grid-template-columns:minmax(0,1fr) auto auto!important;align-items:center!important;gap:8px!important}
            .side .brand{display:flex!important;align-items:center!important;margin:0!important;padding:0!important;min-width:0!important;color:#174f8d!important;font-size:19px!important}
            .side .brand:before{width:38px!important;height:38px!important;flex:0 0 38px!important;border-radius:11px!important}
            .side .brand small{font-size:10px!important;margin-top:2px!important;color:#718096!important}
            .side .nav,.side .userbox,.top{display:none!important}
            #mobileNavToggle,#mobileUserToggle{display:inline-flex!important;align-items:center!important;justify-content:center!important;height:40px!important;border:1px solid #cfdaea!important;border-radius:10px!important;background:#f8fbff!important;color:#173a62!important;cursor:pointer!important}
            #mobileNavToggle{width:44px!important;padding:0!important;font-size:21px!important}
            #mobileUserToggle{width:40px!important;padding:0!important;font-size:24px!important}
            .side.mobile-nav-open .nav{display:grid!important;position:absolute!important;left:10px!important;right:10px!important;top:62px!important;z-index:520!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important;padding:9px!important;background:#fff!important;border:1px solid #d7e1ed!important;border-radius:13px!important;box-shadow:0 14px 34px #10243c26!important;max-height:70vh!important;overflow:auto!important}
            .side.mobile-nav-open .nav button{width:100%!important;min-width:0!important;height:48px!important;padding:7px 10px!important;border-radius:9px!important;background:#f8fafc!important;color:#46617d!important;text-align:left!important;font-size:13px!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:6px!important}
            .side.mobile-nav-open .nav button.active{background:#2f6de5!important;color:#fff!important}
            .side.mobile-nav-open .nav button:before{display:inline-block!important;width:24px!important;margin:0!important;font-size:17px!important;text-align:center!important}
            .side.mobile-user-open .userbox{display:block!important;position:absolute!important;right:10px!important;top:62px!important;z-index:530!important;width:min(280px,calc(100vw - 20px))!important;margin:0!important;padding:12px!important;background:#fff!important;color:#173a62!important;border:1px solid #d7e1ed!important;border-radius:13px!important;box-shadow:0 14px 34px #10243c26!important}
            .side.mobile-user-open .userbox small{color:#718096!important;margin:4px 0 10px!important}
            .side.mobile-user-open .userbox .btn{width:100%!important;min-height:42px!important;background:#fff!important;color:#173a62!important;border:1px solid #d5dfeb!important}
            .content{padding-top:10px!important}
          }
          @media(min-width:761px){#mobileNavToggle,#mobileUserToggle{display:none!important}}
          </style>'''
              s = s.replace('</head>', css + '\n</head>', 1)

          if 'mobile-header-safe-script-v3' not in s:
              js = '''<script id="mobile-header-safe-script-v3">
          (function(){
            function init(){
              var side=document.querySelector('.side');
              if(!side||side.querySelector('#mobileNavToggle'))return;
              var brand=side.querySelector('.brand'),nav=side.querySelector('.nav'),userbox=side.querySelector('.userbox');
              if(!brand||!nav)return;
              var menu=document.createElement('button');menu.type='button';menu.id='mobileNavToggle';menu.textContent='☰';menu.setAttribute('aria-label','Open menu');
              var dots=document.createElement('button');dots.type='button';dots.id='mobileUserToggle';dots.textContent='⋮';dots.setAttribute('aria-label','Open account menu');
              brand.insertAdjacentElement('afterend',menu);menu.insertAdjacentElement('afterend',dots);
              menu.addEventListener('click',function(e){e.stopPropagation();side.classList.toggle('mobile-nav-open');side.classList.remove('mobile-user-open')});
              dots.addEventListener('click',function(e){e.stopPropagation();side.classList.toggle('mobile-user-open');side.classList.remove('mobile-nav-open')});
              nav.addEventListener('click',function(e){if(e.target.closest('button'))side.classList.remove('mobile-nav-open')});
              if(userbox)userbox.addEventListener('click',function(e){e.stopPropagation()});
              document.addEventListener('click',function(e){if(!side.contains(e.target)){side.classList.remove('mobile-nav-open');side.classList.remove('mobile-user-open')}});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
          })();
          </script>'''
              if '</body>' not in s:
                  raise SystemExit('body tag missing')
              a,b=s.rsplit('</body>',1)
              s=a+js+'\n</body>'+b

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Hide mobile nav search and account area behind buttons'
          git push
