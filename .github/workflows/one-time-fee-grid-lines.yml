name: One-time fee grid lines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fee-grid-lines.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update fee grid lines
        run: python3 .github/scripts/fee_grid_lines.py
      - name: Commit fee grid lines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use thin horizontal and vertical fee grid lines"
          git push
