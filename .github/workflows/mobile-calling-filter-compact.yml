name: Mobile Calling Filter Compact

on:
  push:
    paths:
      - '.github/workflows/mobile-calling-filter-compact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact calling filters on small phones
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'mobile-calling-filter-compact-v1'
          if marker in s:
              raise SystemExit('already applied')
          css = '''<style id="mobile-calling-filter-compact-v1">
          @media(max-width:430px){
            #callingPage .heading{margin-bottom:6px!important}
            #callingPage .call-toolbar{
              width:100%!important;
              max-width:none!important;
              margin:4px 0 0 0!important;
              padding:7px!important;
              display:grid!important;
              grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto!important;
              gap:5px!important;
              align-items:center!important;
              justify-content:start!important;
            }
            #callingPage .call-toolbar select{
              width:100%!important;
              min-width:0!important;
              height:36px!important;
              min-height:36px!important;
              padding:5px 25px 5px 8px!important;
              font-size:12px!important;
              border-radius:8px!important;
            }
            #callingPage .call-toolbar button{
              width:auto!important;
              min-width:64px!important;
              height:36px!important;
              min-height:36px!important;
              padding:5px 9px!important;
              font-size:12px!important;
              border-radius:8px!important;
            }
            #callingPage #callQueueInfo{
              grid-column:1/-1!important;
              margin-top:0!important;
              padding-right:2px!important;
              text-align:right!important;
              font-size:11px!important;
            }
          }
          @media(max-width:380px){
            #callingPage .call-toolbar{grid-template-columns:1fr 1fr!important}
            #callingPage .call-toolbar button{grid-column:1/2!important;min-width:0!important;width:100%!important}
            #callingPage #callQueueInfo{grid-column:2/3!important;align-self:center!important;margin:0!important}
          }
          </style>'''
          if '</head>' not in s:
              raise SystemExit('head tag missing')
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Compact mobile calling filters for small screens'
          git push
