name: One-time dynamic fee builder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dynamic-fee-builder.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dynamic fee builder
        run: python3 .github/scripts/add_dynamic_fee_builder.py
      - name: Commit dynamic fee builder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add admin-customizable university fee builder"
          git push
