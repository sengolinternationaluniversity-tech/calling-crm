name: One-time WhatsApp Template Tab v2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-whatsapp-template-tab-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/patch_whatsapp_template_tab.py
      - name: Commit changes
        run: |
          git config user.name "SENGOL INTERNATIONAL UNIVERSITY"
          git config user.email "sengolinternationaluniversity@gmail.com"
          git add index.html
          git commit -m "Add admin WhatsApp template tab"
          git push
