name: Fix Import Mobile Header
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-import-mobile-header.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const normImportKey=k=>String(k||'').trim().toLowerCase().replace(/[._-]+/g,' ').replace(/\\s+/g,' ');"
          new="const normImportKey=k=>String(k||'').trim().toLowerCase().replace(/[._-]+/g,' ').replace(/\\s+/g,' ').trim();"
          if old not in s:
              raise SystemExit('Mobile header normalizer not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Fix Mobile No header detection in import'
          git push
