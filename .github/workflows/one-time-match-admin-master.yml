name: One-time match admin master buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-match-admin-master.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match Admin and Master styles
        run: python .github/scripts/match_admin_master_buttons.py
      - name: Commit top button style
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Match Admin and Master top button styles"
            git push origin main
          fi
