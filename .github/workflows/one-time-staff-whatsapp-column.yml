name: One-time staff WhatsApp column

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-whatsapp-column.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update staff institute WhatsApp display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='/* Staff institute WhatsApp number link */'
          if marker in text:
              raise SystemExit(0)

          old='<td>${mobileBoxes(x.mobile_no)}</td><td>${mobileBoxes(x.whatsapp_no)}</td><td>${esc(x.email_id)}</td>'
          new='<td>${mobileBoxes(x.mobile_no)}</td><td>${isAdmin()?mobileBoxes(x.whatsapp_no):whatsappNumberBoxes(x.whatsapp_no)}</td><td>${esc(x.email_id)}</td>'
          if old not in text:
              raise SystemExit('Institute WhatsApp number render pattern not found')
          text=text.replace(old,new,1)

          css='''\n\n/* Staff institute WhatsApp number link */\nbody.staff-role #institutesPage .institute-data-table th:nth-child(14),\nbody.staff-role #institutesPage .institute-data-table td:nth-child(14){display:none!important}\nbody.staff-role #institutesPage .institute-data-table td:nth-child(9) .wa-stack a.phone-chip{\n  display:inline-block;\n  width:max-content;\n  max-width:100%;\n  background:transparent!important;\n  border:0!important;\n  padding:0!important;\n  color:#218c5a!important;\n  font-weight:650;\n  text-decoration:underline!important;\n  text-underline-offset:2px;\n}\n'''
          text=text.replace('\n</style>',css+'\n</style>',1)
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Simplify staff institute WhatsApp column"
            git push origin main
          fi
