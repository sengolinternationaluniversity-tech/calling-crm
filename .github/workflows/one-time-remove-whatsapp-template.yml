name: One-time Remove WhatsApp Template

on:
  push:
    paths:
      - '.github/workflows/one-time-remove-whatsapp-template.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove WhatsApp Template feature
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          tab = '    <button type="button" class="university-detail-tab admin-only" data-university-tab="messages">WhatsApp Template</button>\n'
          if tab not in s:
              raise SystemExit('WhatsApp Template tab not found')
          s = s.replace(tab, '', 1)

          panel_start = '  <section class="card university-detail-panel admin-only" data-university-panel="messages">'
          outer_marker = '\n</section>\n\n<section id="settingsPage"'
          ps = s.find(panel_start)
          if ps < 0:
              raise SystemExit('WhatsApp Template panel not found')
          oe = s.find(outer_marker, ps)
          if oe < 0:
              raise SystemExit('University Detail page end marker not found')
          chunk = s[ps:oe]
          close = chunk.rfind('\n  </section>')
          if close < 0:
              raise SystemExit('WhatsApp Template panel closing tag not found')
          s = s[:ps] + s[ps + close + len('\n  </section>'):]

          css_start = '\n\n/* University WhatsApp message templates */'
          css_end = '\n\n/* Send template + fee PDF to center */'
          if css_start in s:
              a = s.index(css_start)
              if css_end not in s[a:]:
                  raise SystemExit('WhatsApp Template CSS end marker not found')
              b = s.index(css_end, a)
              s = s[:a] + s[b:]

          # Send-to-Center JS was already removed; remove its now-unused CSS too.
          send_css = '\n\n/* Send template + fee PDF to center */'
          if send_css in s:
              a = s.index(send_css)
              b = s.find('\n\n</style>', a)
              if b < 0:
                  raise SystemExit('Send Center CSS closing marker not found')
              s = s[:a] + s[b:]

          js_start = '\n\n/* Admin WhatsApp message templates */'
          js_end = '\nwindow.addFeeDepartment=async()=>'
          if js_start not in s:
              raise SystemExit('WhatsApp Template JS block not found')
          a = s.index(js_start)
          b = s.index(js_end, a)
          s = s[:a] + s[b:]

          p.write_text(s, encoding='utf-8')
      - name: Verify removal
        run: |
          ! grep -q 'data-university-tab="messages"' index.html
          ! grep -q 'data-university-panel="messages"' index.html
          ! grep -q 'crm_university_message_templates' index.html
          ! grep -q 'loadMessageTemplates' index.html
          ! grep -q 'openMessageTemplateEditor' index.html
          ! grep -q 'openSendToCenter' index.html
          grep -q 'data-university-tab="fee"' index.html
          grep -q 'data-university-tab="approval"' index.html
          grep -q 'data-university-tab="info"' index.html
          git diff --check
      - name: Commit change
        run: |
          git config user.name 'SENGOL INTERNATIONAL UNIVERSITY'
          git config user.email 'sengolinternationaluniversity@gmail.com'
          git add index.html
          git commit -m 'Remove WhatsApp Template feature'
          git push origin main
