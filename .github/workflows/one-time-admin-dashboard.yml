name: One-time admin dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-admin-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build admin management dashboard
        run: python .github/scripts/patch_admin_dashboard.py
      - name: Commit admin dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build admin management dashboard"
            git push origin main
          fi
