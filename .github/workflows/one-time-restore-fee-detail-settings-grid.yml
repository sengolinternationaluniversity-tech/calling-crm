name: One-time restore fee detail and settings grid

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-restore-fee-detail-settings-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore fee detail and arrange settings
        run: python3 .github/scripts/restore_fee_detail_and_3col_settings.py
      - name: Commit fee layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore fee detail and arrange fee settings in 3 columns"
          git push
