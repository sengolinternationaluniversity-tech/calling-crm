name: Mobile Responsive UI
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix-queryselector-foreach.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* MOBILE-FIRST-CRM-V1 */'
          if marker in s:
              raise SystemExit('mobile responsive patch already present')
          css=r'''
/* MOBILE-FIRST-CRM-V1 */
@media (max-width: 768px){
 html,body{max-width:100%;overflow-x:hidden}
 body{font-size:14px}
 .shell{display:block;min-height:100vh}
 .side{position:static!important;inset:auto!important;width:100%!important;min-height:auto!important;padding:10px 10px 8px!important;border-radius:0;box-shadow:none!important}
 .brand{padding:2px 6px 10px!important;font-size:18px!important;gap:8px!important}
 .brand:before{width:32px!important;height:32px!important;border-radius:9px!important}
 .brand small{font-size:10px!important;margin-top:1px!important}
 .nav{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important}
 .nav button{padding:10px 6px!important;font-size:12px!important;text-align:center!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .nav button:before{display:block!important;width:auto!important;margin:0 auto 3px!important;font-size:16px!important}
 .userbox{margin-top:8px!important;padding:9px 10px!important;display:flex!important;align-items:center!important;gap:8px!important;flex-wrap:wrap}
 .userbox small{margin:0!important;flex:1;min-width:120px}
 .userbox .btn,.userbox button{padding:7px 10px!important}
 .main{margin-left:0!important;width:100%!important}
 .top{position:sticky!important;top:0!important;height:auto!important;min-height:54px!important;padding:7px 10px!important;gap:7px!important;z-index:15!important;flex-wrap:wrap!important}
 .top input{width:calc(100% - 52px)!important;max-width:none!important;padding:10px 12px!important}
 .top .role{margin-left:0!important;font-size:11px!important;padding:5px 8px!important}
 .top-master-btn{margin-left:0!important;padding:7px 9px!important;font-size:12px!important}
 .content{padding:10px!important;width:100%!important;max-width:none!important}
 .heading{margin-bottom:10px!important;align-items:flex-start!important;gap:8px!important;flex-wrap:wrap!important}
 .heading h1{font-size:23px!important;line-height:1.15!important}
 .heading p{font-size:12px!important;margin-top:3px!important}
 .card{margin-top:10px!important;padding:11px!important;border-radius:10px!important}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}
 .stat{padding:13px!important;min-height:86px!important}
 .stat:before{display:none!important}
 .stat b{font-size:22px!important}
 .quick-grid,.dashboard-grid,.lower-grid,.staff-grid{grid-template-columns:1fr!important;gap:8px!important}
 .toolbar{gap:7px!important;align-items:stretch!important}
 .filters{width:100%!important;display:grid!important;grid-template-columns:1fr!important;gap:7px!important}
 .filters input,.filters select,.toolbar select,.toolbar input{width:100%!important;min-width:0!important;min-height:42px!important}
 .action-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important;width:100%!important}
 .action-row .btn{width:100%!important}
 .management-tools{padding:9px!important}
 .management-tools .filters{grid-template-columns:1fr!important}
 .master-stats{grid-template-columns:1fr 1fr!important;gap:8px!important}
 .master-mini{min-height:65px!important;padding:9px!important}
 .pager{justify-content:center!important;gap:6px!important;flex-wrap:wrap!important}
 .pager .btn{padding:9px 11px!important}
 .pager label{width:100%!important;justify-content:center!important}
 .table-wrap,.institute-grid-wrap,.previous-call-table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important;width:100%!important}
 table{font-size:12px!important}
 th,td{padding:8px!important}
 .modal-bg{padding:6px!important;align-items:end!important}
 .modal{width:100%!important;max-width:none!important;max-height:94vh!important;border-radius:14px 14px 0 0!important;padding:15px!important}
 .form-grid{grid-template-columns:1fr!important;gap:7px!important}
 .form-grid .full{grid-column:auto!important}
 .field{margin:9px 0!important;gap:5px!important;font-size:12px!important}
 .field input,.field select,.field textarea,input,select,textarea{font-size:16px;max-width:100%}
 .btn,button{min-height:42px;touch-action:manipulation}
 .call-page-tabs{overflow-x:auto!important;white-space:nowrap!important;-webkit-overflow-scrolling:touch!important}
 .call-page-tab{padding:9px 12px!important}
 #callingPage .heading{display:block!important}
 #callingPage .call-toolbar{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important;align-items:center!important}
 #callingPage .call-toolbar select,#callingPage .call-toolbar button{width:100%!important;min-width:0!important}
 #callingPage #callQueueInfo{grid-column:1/-1!important;text-align:right!important;font-size:12px!important}
 #callingPage article.card{padding:9px!important}
 .call-title{display:grid!important;grid-template-columns:1fr auto!important;gap:7px!important;align-items:start!important}
 .call-title>div{min-width:0!important}
 .call-title input,.call-name-input{width:100%!important;min-width:0!important;font-size:18px!important;padding:9px!important}
 .call-title>b{font-size:13px!important;white-space:nowrap!important}
 .call-meta{grid-template-columns:1fr!important;gap:7px!important}
 .call-meta>div{min-width:0!important}
 .call-meta input,.call-meta select{width:100%!important;min-width:0!important;padding:9px!important}
 .call-inline-actions{display:grid!important;grid-template-columns:1fr!important;gap:7px!important;padding-top:0!important}
 .call-inline-actions .btn{width:100%!important}
 .call-inline-quick{display:flex!important;gap:7px!important;flex-wrap:wrap!important}
 .call-inline-quick .btn,.call-inline-quick a{flex:1!important;min-width:120px!important;text-align:center!important}
 .call-form{display:grid!important;grid-template-columns:1fr!important;gap:0!important}
 .call-remarks-field{grid-column:auto!important}
 .call-form textarea{width:100%!important;min-height:74px!important}
 .call-log-actions{display:grid!important;grid-template-columns:76px 1fr 76px!important;gap:6px!important;width:100%!important}
 .call-log-actions .btn{width:100%!important;padding:8px 5px!important;font-size:12px!important;white-space:nowrap!important}
 #callSaveNextBtn{font-size:13px!important}
 .previous-call-history{margin-top:10px!important}
 .previous-call-history summary{font-size:13px!important;padding:9px!important}
 .previous-call-table{min-width:650px!important}
 .follow-tabs{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:5px!important}
 .follow-tabs .btn{padding:7px 4px!important;font-size:12px!important}
 .report-filters,.status-date-filter{display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important}
 .report-filters .field,.status-date-filter .field{margin:0!important}
 .report-filters .btn,.status-date-filter .btn{width:100%!important}
 .history-tools,.history-date-filter{width:100%!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important}
 .history-date-filter label{min-width:0!important}
 .history-date-filter input{width:100%!important}
 .history-status-filter,#callingHistoryCount{grid-column:1/-1!important}
 .call-history-table,.follow-table,.institute-data-table{min-width:900px!important}
 .institute-tabs{overflow-x:auto!important;white-space:nowrap!important}
 .institute-tab{padding:9px 11px!important}
 .assign-panel.active{display:grid!important;grid-template-columns:1fr!important}
 .assign-panel select{min-width:0!important;width:100%!important}
 .selection-tools{display:grid!important;grid-template-columns:1fr 1fr!important}
 .selection-tools #selectionInfo{grid-column:1/-1!important;margin:0!important}
 .downloads{display:grid!important;grid-template-columns:1fr 1fr!important}
}
@media (max-width: 430px){
 .nav{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .stats,.master-stats{grid-template-columns:1fr 1fr!important}
 #callingPage .call-toolbar{grid-template-columns:1fr!important}
 #callingPage #callQueueInfo{grid-column:auto!important}
 .call-log-actions{grid-template-columns:64px 1fr 64px!important}
 .call-log-actions .btn{font-size:11px!important;padding:7px 2px!important}
 .report-filters,.status-date-filter,.history-tools,.history-date-filter{grid-template-columns:1fr!important}
 .action-row{grid-template-columns:1fr!important}
}
'''
          if '</style>' not in s:
              raise SystemExit('style closing tag not found')
          s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Make CRM mobile responsive without changing data logic'
          git push
