name: One-time staff dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-staff-dashboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build staff calling dashboard
        run: |
          python .github/scripts/patch_staff_dashboard.py
          python .github/scripts/fix_staff_dashboard_visibility.py
      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix staff dashboard visibility"
            git push origin main
          fi
