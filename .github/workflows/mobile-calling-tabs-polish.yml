name: Mobile Calling Tabs Polish
on:
  push:
    paths:
      - '.github/workflows/mobile-calling-tabs-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish Calling Status and History mobile UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='mobile-calling-tabs-polish-v1'
          if marker in s:
              raise SystemExit('already applied')
          css=r'''<style id="mobile-calling-tabs-polish-v1">
          @media(max-width:760px){
            #callingPage .call-page-tabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:6px!important;width:100%!important;overflow:visible!important;white-space:normal!important;padding:4px!important;margin:8px 0 10px!important;background:#eef3f9!important;border:1px solid #d9e3ef!important;border-radius:11px!important}
            #callingPage .call-page-tab{min-width:0!important;width:100%!important;min-height:40px!important;padding:8px 4px!important;border:0!important;border-radius:8px!important;background:transparent!important;color:#52667b!important;font-size:12px!important;font-weight:700!important;text-align:center!important;white-space:normal!important;line-height:1.15!important}
            #callingPage .call-page-tab.active{background:#2f6de5!important;color:#fff!important;box-shadow:0 3px 9px #2f6de52e!important}
            #callingPage .follow-tabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;width:100%!important}
            #callingPage .follow-tabs .btn{width:100%!important;min-width:0!important;min-height:38px!important;padding:7px 3px!important;font-size:11px!important;white-space:normal!important;line-height:1.15!important}
            #callingPage .status-date-filter,#callingPage .report-filters,#callingPage .history-tools,#callingPage .history-date-filter{width:100%!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important;align-items:end!important}
            #callingPage .status-date-filter .field,#callingPage .report-filters .field,#callingPage .history-date-filter label{min-width:0!important;width:100%!important;margin:0!important}
            #callingPage .status-date-filter input,#callingPage .status-date-filter select,#callingPage .report-filters input,#callingPage .report-filters select,#callingPage .history-tools input,#callingPage .history-tools select,#callingPage .history-date-filter input,#callingPage .history-date-filter select{width:100%!important;min-width:0!important;min-height:38px!important;padding:7px 8px!important;font-size:12px!important}
            #callingPage .history-status-filter,#callingPage #callingHistoryCount{grid-column:1/-1!important}
            #callingPage .call-history-table,#callingPage .follow-table{min-width:760px!important}
            #callingPage .table-wrap{border-radius:9px!important;border:1px solid #e1e8f0!important;overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
          }
          @media(max-width:430px){
            #callingPage .call-page-tabs{gap:4px!important;padding:3px!important}
            #callingPage .call-page-tab{font-size:11px!important;min-height:38px!important;padding:7px 2px!important}
            #callingPage .status-date-filter,#callingPage .report-filters,#callingPage .history-tools,#callingPage .history-date-filter{grid-template-columns:1fr!important}
            #callingPage .history-status-filter,#callingPage #callingHistoryCount{grid-column:auto!important}
          }
          </style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Polish mobile Calling Status and Call History tabs'
          git push
