name: One-time University Info editor patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_university_info_editor.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: python .github/scripts/add_university_info_editor.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add editable University Info table"
            git push
          fi
