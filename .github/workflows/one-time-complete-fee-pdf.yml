name: One-time Complete Fee PDF

on:
  push:
    paths:
      - '.github/workflows/one-time-complete-fee-pdf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply complete fee PDF patch
        run: python .github/scripts/patch_complete_fee_pdf.py
      - name: Verify patch
        run: |
          grep -q 'jspdf-autotable@3.8.4' index.html
          grep -q 'SIU-Complete-Fee-Structure.pdf' index.html
          grep -q 'Download Complete Fee PDF' index.html
          grep -q 'Share Complete PDF + Message' index.html
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'SENGOL INTERNATIONAL UNIVERSITY'
          git config user.email 'sengolinternationaluniversity@gmail.com'
          git add index.html
          git commit -m 'Send complete fee structure PDF to centers'
          git push origin main
