name: One-time university detail tabs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-university-detail-tabs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add university detail buttons
        run: python3 .github/scripts/add_university_detail_tabs.py
      - name: Commit university detail buttons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Fee Detail Approval and University Info tabs"
          git push
