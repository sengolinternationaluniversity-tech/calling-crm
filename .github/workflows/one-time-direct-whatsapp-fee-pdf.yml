name: One-time Direct WhatsApp Fee PDF

on:
  push:
    paths:
      - '.github/workflows/one-time-direct-whatsapp-fee-pdf.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch direct WhatsApp behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('WhatsApp / Share Complete PDF + Message', 'Download PDF + Open WhatsApp')
          s = s.replace(
              '<b>Phone:</b> “Share Complete PDF + Message” supported mobile browsers par native share kholta hai, jahan WhatsApp choose karke complete PDF + message bhej sakte hain.<br><b>Desktop:</b> “Download Complete Fee PDF” karein, phir “Open WhatsApp” se message kholkar PDF attach karein.',
              '<b>Direct WhatsApp:</b> “Download PDF + Open WhatsApp” se complete PDF download hoga aur Calling mein selected WhatsApp number direct message ke saath khulega. PDF ko WhatsApp mein attach karke send karein.<br><b>Desktop:</b> same selected number WhatsApp Web/App mein khulega.'
          )

          old = '''window.shareSendCenter=async()=>{
           const pdf=createSendCenterPdf();if(!pdf)return;const message=$('#sendCenterMessage')?.value?.trim()||sendCenterTemplateText();try{if(navigator.share&&navigator.canShare?.({files:[pdf.file]})){await navigator.share({title:'Sengol International University Fee Structure',text:message,files:[pdf.file]});return}}catch(e){if(e?.name==='AbortError')return}
           pdf.doc.save(pdf.filename);openSendCenterWhatsapp();toast('Complete fee PDF download ho gaya. WhatsApp mein is PDF ko attach karke send karein.')
          };'''
          new = '''window.shareSendCenter=()=>{
           const num=sendCenterWaNumber($('#sendCenterWhatsapp')?.value),message=$('#sendCenterMessage')?.value?.trim()||sendCenterTemplateText();if(!num){toast('WhatsApp number nahi mila');return}
           const pdf=createSendCenterPdf();if(!pdf)return;
           const url=`https://wa.me/${num}?text=${encodeURIComponent(message)}`;
           const opened=window.open(url,'_blank','noopener');
           pdf.doc.save(pdf.filename);
           toast(opened?'Complete PDF downloaded. Selected WhatsApp number khul gaya — PDF attach karke send karein.':'Complete PDF downloaded. WhatsApp popup allow karke dobara click karein.')
          };'''
          if old not in s:
              raise SystemExit('shareSendCenter block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify patch
        run: |
          grep -q 'Download PDF + Open WhatsApp' index.html
          grep -q "const opened=window.open(url,'_blank','noopener')" index.html
          ! grep -q 'navigator.canShare?.({files:\[pdf.file\]})' index.html
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'SENGOL INTERNATIONAL UNIVERSITY'
          git config user.email 'sengolinternationaluniversity@gmail.com'
          git add index.html
          git commit -m 'Open selected WhatsApp number with complete fee PDF flow'
          git push origin main
