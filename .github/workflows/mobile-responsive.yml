name: Searchable Blank State In Staff Calling
on:
  push:
    paths:
      - '.github/workflows/mobile-responsive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make blank state searchable with existing admin states
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<div><small>State</small>${String(x.state||\'\').trim()?`<input name="state" value="${attr(x.state||\'\')}" readonly aria-readonly="true">`:`<select name="state"><option value="">Select State</option>${(S.callStateOptions||[]).map(v=>`<option value="${attr(v)}">${esc(v)}</option>`).join(\'\')}</select>`}</div>'
          new='<div><small>State</small>${String(x.state||\'\').trim()?`<input name="state" value="${attr(x.state||\'\')}" readonly aria-readonly="true">`:`<input name="state" list="callStateList" value="" placeholder="State search karein" autocomplete="off"><datalist id="callStateList">${(S.callStateOptions||[]).map(v=>`<option value="${attr(v)}"></option>`).join(\'\')}</datalist>`}</div>'
          if old not in s:
              raise SystemExit('blank state dropdown target not found')
          s=s.replace(old,new,1)

          old="const stateInput=$('#callDetailsForm').elements.state;if(stateInput)stateInput.addEventListener('change',()=>{stateInput.classList?.remove('field-invalid')});"
          new="const stateInput=$('#callDetailsForm').elements.state;if(stateInput)stateInput.addEventListener('input',()=>{stateInput.classList?.remove('field-invalid')});if(stateInput)stateInput.addEventListener('change',()=>{const known=(S.callStateOptions||[]),m=known.find(v=>v.toLowerCase()===String(stateInput.value||'').trim().toLowerCase());if(m)stateInput.value=m});"
          if old not in s:
              raise SystemExit('state listener target not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Add searchable existing-state picker for blank staff records'
          git push
