name: Mobile Calling Layout Fix
on:
  push:
    paths:
      - '.github/workflows/mobile-responsive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve mobile calling UI only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='mobile-calling-layout-v2'
          s=re.sub(r'<style id="'+marker+r'">.*?</style>','',s,flags=re.S)
          css=r'''<style id="mobile-calling-layout-v2">
@media (max-width:760px){
  html,body{max-width:100%;overflow-x:hidden}
  body{padding-bottom:76px;background:#f6f8fc}
  .main{margin-left:0!important;width:100%!important;min-width:0!important}
  .content{padding:12px!important;max-width:100%!important}

  /* compact mobile navigation at bottom */
  .side{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;width:100%!important;height:68px!important;min-height:68px!important;padding:5px 6px!important;background:#fff!important;border-top:1px solid #d8e1ee!important;box-shadow:0 -4px 18px #10243c14!important;z-index:999!important;display:block!important}
  .side .brand,.side .userbox{display:none!important}
  .side .nav{height:100%!important;display:flex!important;grid-template-columns:none!important;gap:2px!important;overflow-x:auto!important;overflow-y:hidden!important;align-items:stretch!important;scrollbar-width:none!important}
  .side .nav::-webkit-scrollbar{display:none!important}
  .side .nav button{flex:1 0 72px!important;min-width:72px!important;height:58px!important;padding:5px 3px!important;border-radius:10px!important;color:#59708a!important;text-align:center!important;font-size:11px!important;line-height:1.1!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:3px!important;background:transparent!important}
  .side .nav button:before{display:block!important;width:auto!important;margin:0!important;font-size:19px!important;line-height:1!important}
  .side .nav button.active{background:#eaf2ff!important;color:#2167d7!important}

  /* compact top search */
  .top{position:sticky!important;top:0!important;z-index:100!important;height:60px!important;min-height:60px!important;padding:8px 10px!important;gap:8px!important;background:#fff!important}
  .top input{width:100%!important;max-width:none!important;min-width:0!important;height:42px!important;padding:9px 13px!important;border:1px solid #d4deeb!important;border-radius:12px!important;background:#f8fafc!important;font-size:15px!important}
  .top .role,.role{flex:0 0 auto!important;margin-left:0!important;padding:7px 10px!important;font-size:12px!important;white-space:nowrap!important}
  .top-master-btn{display:none!important}

  /* calling header */
  body.staff-role #callingPage.active,#callingPage.active{display:block!important}
  #callingPage>.heading{display:block!important;margin:4px 0 10px!important}
  #callingPage>.heading h1{font-size:25px!important;line-height:1.1!important;margin:0!important}
  #callingPage>.heading p{font-size:13px!important;line-height:1.35!important;margin:4px 0 0!important;color:#75839a!important}

  /* filters full width and compact */
  #callingPage .call-toolbar{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;width:100%!important;margin:0 0 10px!important;padding:10px!important;border:1px solid #dbe4f0!important;border-radius:14px!important;background:#fff!important;box-shadow:none!important}
  #callingPage .call-toolbar select,#callingPage .call-toolbar button{width:100%!important;min-width:0!important;height:42px!important;margin:0!important;border-radius:10px!important;font-size:14px!important}
  #callingPage .call-toolbar button{grid-column:1/-1!important}
  #callingPage #callQueueInfo{grid-column:1/-1!important;text-align:right!important;font-size:12px!important;line-height:1!important;margin:0!important;color:#64748b!important}

  /* tabs */
  #callingPage>.call-page-tabs{display:flex!important;gap:0!important;margin:0 0 10px!important;padding:0!important;overflow-x:auto!important;white-space:nowrap!important;border-bottom:1px solid #d8e0ea!important;background:transparent!important}
  #callingPage .call-page-tab{flex:1 0 auto!important;min-width:92px!important;padding:10px 12px!important;font-size:14px!important;text-align:center!important}

  /* record card */
  #callingPage #callingTabPanel>.card,#callingPage .call-page-panel>.card{margin:0!important;padding:12px!important;border-radius:14px!important;box-shadow:none!important}
  #callRecord{width:100%!important;min-width:0!important}
  .call-record{padding:0!important;border:0!important;box-shadow:none!important;background:#fff!important}
  .call-title{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;gap:8px!important;align-items:start!important;margin-bottom:10px!important}
  .call-title input,.call-name-input{width:100%!important;min-width:0!important;font-size:17px!important;font-weight:700!important;height:44px!important}
  .call-title>b{font-size:12px!important;padding-top:18px!important;white-space:nowrap!important}

  .call-meta{display:grid!important;grid-template-columns:1fr!important;gap:9px!important}
  .call-meta>div{min-width:0!important;width:100%!important}
  .call-meta small{display:block!important;margin-bottom:4px!important;font-size:12px!important}
  .call-meta input,.call-meta select,.call-meta button,#callStateDropdownBtn{width:100%!important;min-width:0!important;height:43px!important;font-size:14px!important;border-radius:9px!important}
  .call-inline-actions{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;align-items:stretch!important}
  .call-inline-actions>#callUpdateBtn{width:100%!important}
  .call-inline-quick{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;width:100%!important}
  .call-inline-quick .btn,.call-inline-quick a{width:100%!important;min-height:43px!important;display:flex!important;align-items:center!important;justify-content:center!important;text-align:center!important;white-space:normal!important}

  .call-form{display:grid!important;grid-template-columns:1fr!important;gap:9px!important;margin-top:10px!important}
  .call-form .field{margin:0!important;gap:4px!important;font-size:12px!important}
  .call-form input,.call-form select,.call-form textarea{width:100%!important;min-width:0!important;font-size:14px!important;border-radius:9px!important}
  .call-form input,.call-form select{height:43px!important;padding:8px 10px!important}
  .call-form textarea{min-height:82px!important;padding:9px 10px!important}
  .call-remarks-field{grid-column:1!important}

  /* action buttons: easy thumb reach */
  .call-log-actions{position:sticky!important;bottom:74px!important;z-index:80!important;display:grid!important;grid-template-columns:78px minmax(0,1fr) 78px!important;gap:7px!important;width:100%!important;padding:8px!important;margin:2px -2px 0!important;background:#ffffffee!important;backdrop-filter:blur(6px)!important;border:1px solid #dbe4ef!important;border-radius:12px!important;box-shadow:0 5px 18px #10243c16!important}
  .call-log-actions .btn{width:100%!important;min-width:0!important;min-height:44px!important;padding:7px 5px!important;font-size:12px!important;white-space:normal!important}
  #callSaveNextBtn{font-size:13px!important;font-weight:700!important}

  /* history */
  .previous-call-history{margin-top:10px!important;border-radius:12px!important;overflow:hidden!important}
  .previous-call-history summary{padding:11px!important;font-size:13px!important}
  .previous-call-table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
  .previous-call-table{min-width:680px!important;font-size:12px!important}

  /* searchable state dropdown stays within screen */
  #callStatePicker{width:100%!important}
  #callStateDropdownMenu{position:absolute!important;left:0!important;right:0!important;width:100%!important;max-width:100%!important;z-index:200!important}
  #callStateOptions{max-height:220px!important}

  /* dialogs/forms */
  .modal-bg{padding:8px!important}
  .modal{width:100%!important;max-width:100%!important;max-height:94vh!important;padding:14px!important;border-radius:14px!important}
  .form-grid{grid-template-columns:1fr!important}
  .form-grid .full{grid-column:1!important}

  /* generic tables do not break viewport */
  .table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch!important}
  table{max-width:none!important}
}
</style>'''
          s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Fix staff calling layout for mobile screens'
          git push
