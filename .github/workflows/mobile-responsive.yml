name: Sync All Admin States To Staff Calling
on:
  push:
    paths:
      - '.github/workflows/mobile-responsive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff state source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          marker="async function loadAllCallStates(){"
          if marker not in s:
              anchor="function callQuery(){"
              if anchor not in s:
                  raise SystemExit('callQuery anchor not found')
              fn="async function loadAllCallStates(){const {data,error}=await db.from('crm_state_options').select('state').order('state',{ascending:true});if(error){toast('State list load nahi hui: '+error.message);S.callStateOptions=[];return}S.callStateOptions=[...new Set((data||[]).map(x=>String(x.state||'').trim()).filter(Boolean))]}\n"
              s=s.replace(anchor,fn+anchor,1)

          old="async function loadCalling(){const mode=$('#callQueueFilter')?.value||'pending'"
          new="async function loadCalling(){if(!Array.isArray(S.callStateOptions))await loadAllCallStates();const mode=$('#callQueueFilter')?.value||'pending'"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('loadCalling target not found')

          old="${[...new Set((S.masterRows||[]).map(r=>String(r.state||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(v=>`<option value=\"${attr(v)}\"></option>`).join('')}"
          new="${(S.callStateOptions||[]).map(v=>`<option value=\"${attr(v)}\"></option>`).join('')}"
          if old in s:
              s=s.replace(old,new,1)

          old="knownStates=[...new Set((S.masterRows||[]).map(r=>String(r.state||'').trim()).filter(Boolean))]"
          new="knownStates=(S.callStateOptions||[])"
          if old in s:
              s=s.replace(old,new,1)

          old="const known=[...new Set((S.masterRows||[]).map(r=>String(r.state||'').trim()).filter(Boolean))]"
          new="const known=(S.callStateOptions||[])"
          if old in s:
              s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Show all admin states in staff calling state search'
          git push
