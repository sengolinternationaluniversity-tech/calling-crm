name: Add Calling Location State Editing
on:
  push:
    paths:
      - '.github/workflows/mobile-responsive.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch staff calling location and state
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<div><small>Location</small><input name="location" value="${attr(x.location||\'\')}" placeholder="-"></div><div><small>State</small><input name="state" value="${attr(x.state||\'\')}" placeholder="-" readonly aria-readonly="true"></div>'
          new='<div><small>Location</small><input name="location" value="${attr(x.location||\'\')}" placeholder="Location add karein"></div><div><small>State</small><input name="state" list="callStateList" value="${attr(x.state||\'\')}" placeholder="State search karein" autocomplete="off"><datalist id="callStateList">${[...new Set((S.masterRows||[]).map(r=>String(r.state||\'\').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).map(v=>`<option value="${attr(v)}"></option>`).join(\'\')}</datalist></div>'
          if old not in s:
              raise SystemExit('render state/location target not found')
          s=s.replace(old,new,1)

          old="async function saveCallDetails(e){e.preventDefault();const x=S.callRows[S.callIndex],f=e.target;if(!validateInterestedDetails(f,x))return;const payload={institute_name:$('#callInstituteName').value.trim()||null,owner_name:f.elements.owner_name.value.trim()||null,mobile_no:mergePhones('',f.elements.mobile_no.value)||null,whatsapp_no:mergePhones('',f.elements.whatsapp_no.value)||null,email_id:f.elements.email_id.value.trim()||null,location:f.elements.location.value.trim()||null};"
          new="async function saveCallDetails(e){e.preventDefault();const x=S.callRows[S.callIndex],f=e.target;if(!validateInterestedDetails(f,x))return;const typedState=String(f.elements.state?.value||'').trim(),knownStates=[...new Set((S.masterRows||[]).map(r=>String(r.state||'').trim()).filter(Boolean))],matchedState=typedState?knownStates.find(v=>v.toLowerCase()===typedState.toLowerCase()):'';if(typedState&&!matchedState){f.elements.state.classList.add('field-invalid');toast('State sirf existing list me se select karein');f.elements.state.focus();return}const payload={institute_name:$('#callInstituteName').value.trim()||null,owner_name:f.elements.owner_name.value.trim()||null,mobile_no:mergePhones('',f.elements.mobile_no.value)||null,whatsapp_no:mergePhones('',f.elements.whatsapp_no.value)||null,email_id:f.elements.email_id.value.trim()||null,location:f.elements.location.value.trim()||null,state:matchedState||null};"
          if old not in s:
              raise SystemExit('saveCallDetails target not found')
          s=s.replace(old,new,1)

          old="$('#callDetailsForm').addEventListener('input',e=>{e.target.classList?.remove('field-invalid');if(S.callDetailsUpdatedId===x.id)S.callDetailsUpdatedId=null;syncCallButtons()});"
          new="$('#callDetailsForm').addEventListener('input',e=>{e.target.classList?.remove('field-invalid');if(S.callDetailsUpdatedId===x.id)S.callDetailsUpdatedId=null;syncCallButtons()});const stateInput=$('#callDetailsForm').elements.state;if(stateInput)stateInput.addEventListener('change',()=>{const known=[...new Set((S.masterRows||[]).map(r=>String(r.state||'').trim()).filter(Boolean))],m=known.find(v=>v.toLowerCase()===String(stateInput.value||'').trim().toLowerCase());if(m)stateInput.value=m});"
          if old not in s:
              raise SystemExit('callDetails input listener target not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions
          git config user.email actions@github.com
          git add index.html
          git commit -m 'Allow staff to edit location and pick searchable existing state'
          git push
