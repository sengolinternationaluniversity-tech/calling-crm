name: One-time separate fee settings tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-separate-fee-settings-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Separate fee settings tab
        run: python3 .github/scripts/separate_fee_settings_tab.py
      - name: Commit fee settings tab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move fee column controls to separate settings tab"
          git push
