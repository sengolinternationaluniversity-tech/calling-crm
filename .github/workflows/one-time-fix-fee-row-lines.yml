name: One-time fix fee row lines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-fee-row-lines.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix fee row lines
        run: python3 .github/scripts/fix_fee_row_lines.py
      - name: Commit fee row lines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make fee table horizontal lines clearly visible"
          git push
